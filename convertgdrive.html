<!-- Copy kode ini dan tempel di 'Embed Code' Google Sites -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; }</style>

<div class="p-4 bg-slate-50 min-h-screen">
  <div class="max-w-md mx-auto space-y-6">
    <div class="text-center">
      <h2 class="text-xl font-bold text-slate-800">G-Drive Image Converter</h2>
      <p class="text-xs text-slate-500">Ubah link Drive menjadi link gambar langsung</p>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Link Google Drive</label>
        <input type="text" id="inputUrl" placeholder="Tempel link di sini..." 
               class="w-full p-3 border-2 border-slate-100 rounded-xl focus:border-blue-500 outline-none transition-all text-sm">
      </div>

      <div id="resultArea" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Direct URL</label>
          <div class="flex gap-2">
            <input type="text" id="directLink" readonly class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
            <button onclick="copy('directLink')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">Salin</button>
          </div>
        </div>
        
        <div class="pt-4 border-t border-slate-100">
          <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Preview</label>
          <div class="aspect-video bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex items-center justify-center">
            <img id="preview" src="" class="max-w-full max-h-full object-contain">
          </div>
        </div>
      </div>
    </div>
    
    <div class="bg-amber-50 p-4 rounded-xl border border-amber-100 text-[10px] text-amber-800">
      <strong>Penting:</strong> Pastikan setting Share file di Drive diatur ke <strong>"Anyone with the link"</strong>.
    </div>
    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-slate-500 text-sm font-medium">PakBe</p>
            <p class="text-slate-400 text-xs mt-2">&copy; 2026 E-Centrum UNIMMA. Hak Cipta Dilindungi.</p>
        </div>
    </footer>
  </div>
</div>

<script>
  const input = document.getElementById('inputUrl');
  const resultArea = document.getElementById('resultArea');
  const directInput = document.getElementById('directLink');
  const previewImg = document.getElementById('preview');

  input.addEventListener('input', (e) => {
    const url = e.target.value.trim();
    const idMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    
    if (idMatch && idMatch[1]) {
      const id = idMatch[1];
      const direct = `https://lh3.googleusercontent.com/d/${id}`;
      directInput.value = direct;
      previewImg.src = direct;
      resultArea.classList.remove('hidden');
    } else {
      resultArea.classList.add('hidden');
    }
  });

  function copy(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
    alert('Link tersalin!');
  }
</script>
